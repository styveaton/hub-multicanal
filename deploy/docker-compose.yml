# OmniList en production sur un VPS : site, API, worker, Postgres, Redis et stockage des photos.
# Lancement (depuis la racine du dépôt) : docker compose -f deploy/docker-compose.yml up -d --build
# Seul le site est exposé, sur 127.0.0.1:3100 : le proxy HTTPS du serveur (nginx, openresty…)
# relaie https://omnilist.1handbiz.com vers ce port. Le site relaie lui-même /api vers l'API.
name: omnilist

x-app: &app
  # Image construite une seule fois (par le service migrate), réutilisée par les autres.
  image: omnilist-app:latest
  pull_policy: never
  restart: unless-stopped
  env_file: ${OMNILIST_ENV_FILE:-../env/production.env}
  # Adresses internes au réseau Docker : elles remplacent celles du fichier d'environnement.
  environment:
    NODE_ENV: production
    API_URL: http://api:4000
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://s3:8333
    S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${OMNILIST_ENV_FILE:-../env/production.env} # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  # Photos des produits (compatible S3). Clés dans deploy/seaweedfs/s3.json, créé par deploy/setup-env.sh.
  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024 -volume.max=20
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Applique les migrations de la base puis s'arrête ; l'API et le worker attendent qu'elle ait fini.
  migrate:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    pull_policy: build
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    command: ["node", "apps/api/dist/server.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }
      s3: { condition: service_started }

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/index.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node", "/app/node_modules/next/dist/bin/next", "start", "-p", "3000"]
    # Proxy installé dans Docker (ex. Nginx Proxy Manager) : mettre OMNILIST_BIND=172.17.0.1 dans deploy/.env.
    ports: ["${OMNILIST_BIND:-127.0.0.1}:${OMNILIST_PORT:-3100}:3000"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  s3data:
